global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: korea-job-intelligence
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          application: korea-job-intelligence

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
