name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build

      - name: Coverage summary
        if: always()
        run: |
          report=build/reports/jacoco/test/jacocoTestReport.xml
          if [ ! -f "$report" ]; then
            echo "No JaCoCo report produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          print("### Coverage\n")
          print("| Metric | Covered | Missed | % |")
          print("| --- | ---: | ---: | ---: |")
          for counter in root.findall("counter"):
              kind = counter.get("type")
              covered = int(counter.get("covered"))
              missed = int(counter.get("missed"))
              total = covered + missed
              percent = f"{100 * covered / total:.1f}" if total else "-"
              print(f"| {kind.title()} | {covered} | {missed} | {percent} |")
          PY

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/build/reports/tests/test/
            backend/build/test-results/test/
            backend/build/reports/jacoco/test/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload boot jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  image:
    name: container image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f backend/Dockerfile -t korea-job-intelligence-backend:${{ github.sha }} backend

      - name: Start the image against a real database
        run: |
          docker network create kji-ci
          docker run -d --name kji-postgres --network kji-ci             -e POSTGRES_DB=kji -e POSTGRES_USER=kji -e POSTGRES_PASSWORD=kji             postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec kji-postgres pg_isready -U kji -d kji && break
            sleep 2
          done
          docker run -d --name kji-backend --network kji-ci -p 8080:8080             -e DATABASE_URL=jdbc:postgresql://kji-postgres:5432/kji             -e DATABASE_USERNAME=kji -e DATABASE_PASSWORD=kji             -e INTERNAL_API_TOKEN=ci-token             korea-job-intelligence-backend:${{ github.sha }}

      - name: Verify it serves with the schema migrated
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/actuator/health
          echo
          curl -fsS "http://localhost:8080/api/sources" | head -c 400
          echo
          curl -fsS "http://localhost:8080/api/jobs?size=1"

      - name: Container logs on failure
        if: failure()
        run: docker logs kji-backend 2>&1 | tail -60
