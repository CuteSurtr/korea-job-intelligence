name: korea-job-intelligence

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kji}
      POSTGRES_USER: ${POSTGRES_USER:-kji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kji}
      # Read by the init script below, which creates the role Grafana connects as.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-kji}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kji-postgres:/var/lib/postgresql/data
      # Runs only when the volume is empty. An existing stack has to be given the role by hand;
      # ops/postgres/grafana-readonly.sql says how.
      - ./ops/postgres/grafana-readonly.sql:/docker-entrypoint-initdb.d/10-grafana-readonly.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kji} -d ${POSTGRES_DB:-kji}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kji}
      DATABASE_USERNAME: ${POSTGRES_USER:-kji}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-kji}
      REDIS_HOST: redis
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      INGESTION_SCHEDULER_ENABLED: ${INGESTION_SCHEDULER_ENABLED:-false}
      # Documented as overridable, so they have to actually reach the process. Compose does
      # not forward a variable just because it is in .env; each one has to be named here.
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      INGESTION_STALE_AFTER: ${INGESTION_STALE_AFTER:-P14D}
      INGESTION_UNVERIFIED_AFTER: ${INGESTION_UNVERIFIED_AFTER:-P3D}
      INGESTION_FIXED_DELAY: ${INGESTION_FIXED_DELAY:-PT6H}
      SOURCE_CIRCUIT_FAILURE_THRESHOLD: ${SOURCE_CIRCUIT_FAILURE_THRESHOLD:-5}
      SOURCE_REQUEST_TIMEOUT: ${SOURCE_REQUEST_TIMEOUT:-PT10S}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      # The console writes through the API's guarded endpoints. Its server actions read this
      # and send it themselves, so the token stays on the server and never reaches a browser.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The application database, for the discovery dashboard. Prometheus answers whether
      # ingestion is working; this answers what it found, which is a join, not a counter.
      GRAFANA_DB_HOST: postgres
      GRAFANA_DB_PORT: "5432"
      GRAFANA_DB_NAME: ${POSTGRES_DB:-kji}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-kji_readonly}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-kji}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - kji-grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

volumes:
  kji-postgres:
  kji-grafana:
